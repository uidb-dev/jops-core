<div class="mx-auto mt-8 max-w-sm rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
  <h1 class="text-xl font-semibold text-slate-900">Sign in</h1>
  <p class="mt-1 text-sm text-slate-500">
    Mock login: any username and password work. Nothing is sent to a server.
  </p>
  <form id="login_form" jops-event-bind onsubmit="login" class="mt-6 space-y-4">
    <label class="block text-sm">
      <span class="font-medium text-slate-700">Username</span>
      <input
        id="username"
        name="username"
        required
        autocomplete="username"
        class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2"
      />
    </label>
    <label class="block text-sm">
      <span class="font-medium text-slate-700">Password</span>
      <input
        name="password"
        type="password"
        required
        autocomplete="current-password"
        class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2"
      />
    </label>
    <button
      type="submit"
      class="w-full rounded-md bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-500"
    >
      Sign in
    </button>
  </form>
</div>
