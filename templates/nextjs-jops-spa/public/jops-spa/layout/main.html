<div class="jops-spa">
  <!-- The first route is the default one: a fresh visit opens the login. -->
  <Router jops>
    <Login
      jops
      path="/login"
      src="/jops-spa/Login.js"
      layout="/jops-spa/layout/login.html"
    ></Login>
    <Quotes
      jops
      path="/quotes"
      src="/jops-spa/Quotes.js"
      layout="/jops-spa/layout/quotes.html"
    ></Quotes>
  </Router>
</div>
