<div class="quotes-list">
  <div class="mb-6 flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 class="text-2xl font-semibold text-slate-900">Sales quotes</h1>
      <p class="mt-1 text-sm text-slate-500">
        Signed in as <span id="user_name" class="font-medium text-slate-700"></span>.
        Data from <code class="rounded bg-slate-100 px-1">GET /api/quotes</code>.
      </p>
    </div>
    <button
      jops-event-bind
      type="button"
      onclick="logout"
      class="rounded-md border border-slate-300 bg-white px-3.5 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50"
    >
      Log out
    </button>
  </div>

  <!-- Filter tabs: buttons (not href="#" links), so a click adds no history entry. -->
  <nav id="tabs" class="mb-4 flex flex-wrap gap-1" aria-label="Filter by status">
    <button jops-event-bind type="button" onclick="filterQuotes" data-status="" class="rounded-md px-3 py-1.5 text-sm capitalize bg-indigo-600 text-white">all</button>
    <button jops-event-bind type="button" onclick="filterQuotes" data-status="draft" class="rounded-md px-3 py-1.5 text-sm capitalize bg-white text-slate-600 ring-1 ring-slate-200 hover:bg-slate-50">draft</button>
    <button jops-event-bind type="button" onclick="filterQuotes" data-status="sent" class="rounded-md px-3 py-1.5 text-sm capitalize bg-white text-slate-600 ring-1 ring-slate-200 hover:bg-slate-50">sent</button>
    <button jops-event-bind type="button" onclick="filterQuotes" data-status="accepted" class="rounded-md px-3 py-1.5 text-sm capitalize bg-white text-slate-600 ring-1 ring-slate-200 hover:bg-slate-50">accepted</button>
    <button jops-event-bind type="button" onclick="filterQuotes" data-status="rejected" class="rounded-md px-3 py-1.5 text-sm capitalize bg-white text-slate-600 ring-1 ring-slate-200 hover:bg-slate-50">rejected</button>
  </nav>

  <!-- Skeleton while GET /api/quotes runs. -->
  <div id="quotes-loading"></div>
  <div id="quotes-table" hidden class="overflow-x-auto rounded-lg border border-slate-200 bg-white shadow-sm">
    <table class="min-w-full divide-y divide-slate-200 text-sm">
      <thead class="bg-slate-50 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">
        <tr>
          <th class="px-4 py-3">Quote</th>
          <th class="px-4 py-3">Company</th>
          <th class="px-4 py-3">Deal</th>
          <th class="px-4 py-3">Status</th>
          <th class="px-4 py-3">Created</th>
          <th class="px-4 py-3 text-right">Total</th>
        </tr>
      </thead>
      <!-- One QuoteRow view per quote, added by Quotes.loadQuotes(). -->
      <tbody id="quote-rows" class="divide-y divide-slate-100"></tbody>
    </table>
  </div>
  <p id="quotes-empty" hidden class="mt-4 rounded-lg border border-dashed border-slate-300 p-8 text-center text-slate-500">
    No quotes here yet.
  </p>
</div>
