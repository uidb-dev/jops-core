<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <rect width="400" height="320" fill="#0f1117"/>

  <text x="200" y="30" text-anchor="middle" fill="#7c8cf8" font-size="13" font-weight="bold" letter-spacing="2">NAVIGATION MODEL</text>

  <!-- Flat tab row -->
  <text x="20" y="60" fill="#5a6080" font-size="10">FLAT  (hashchange)</text>

  <rect x="20" y="68" width="70" height="34" rx="5" fill="#1a2a1a" stroke="#56cfb2" stroke-width="2"/>
  <text x="55" y="90" text-anchor="middle" fill="#56cfb2" font-size="11">Home</text>

  <rect x="100" y="68" width="70" height="34" rx="5" fill="#1e2235" stroke="#3d4466" stroke-width="1"/>
  <text x="135" y="90" text-anchor="middle" fill="#3d4466" font-size="11">Media</text>

  <rect x="180" y="68" width="70" height="34" rx="5" fill="#1e2235" stroke="#3d4466" stroke-width="1"/>
  <text x="215" y="90" text-anchor="middle" fill="#3d4466" font-size="11">Form</text>

  <rect x="260" y="68" width="70" height="34" rx="5" fill="#1e2235" stroke="#3d4466" stroke-width="1"/>
  <text x="295" y="90" text-anchor="middle" fill="#3d4466" font-size="11">Contact</text>

  <!-- Tab switch arrows -->
  <line x1="90" y1="85" x2="100" y2="85" stroke="#56cfb2" stroke-width="1.2"/>
  <line x1="170" y1="85" x2="180" y2="85" stroke="#3d4466" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="250" y1="85" x2="260" y2="85" stroke="#3d4466" stroke-width="1" stroke-dasharray="3 2"/>

  <line x1="20" y1="116" x2="380" y2="116" stroke="#1e2235" stroke-width="1"/>

  <!-- Stack navigation -->
  <text x="20" y="136" fill="#5a6080" font-size="10">HIERARCHICAL  (navigate / back)</text>

  <!-- Stack frames -->
  <rect x="20" y="148" width="110" height="50" rx="5" fill="#1a2a1a" stroke="#56cfb2" stroke-width="1.5"/>
  <text x="75" y="168" text-anchor="middle" fill="#56cfb2" font-size="10">Home  ← _baseView</text>
  <text x="75" y="183" text-anchor="middle" fill="#3d4466" font-size="9">flat route instance</text>

  <!-- navigate arrow -->
  <line x1="130" y1="173" x2="158" y2="173" stroke="#7c8cf8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="144" y="167" text-anchor="middle" fill="#7c8cf8" font-size="9">navigate()</text>

  <rect x="160" y="148" width="110" height="50" rx="5" fill="#1e2235" stroke="#f0a040" stroke-width="1.5"/>
  <text x="215" y="168" text-anchor="middle" fill="#f0a040" font-size="10">DetailView</text>
  <text x="215" y="183" text-anchor="middle" fill="#3d4466" font-size="9">new instance</text>

  <!-- navigate arrow 2 -->
  <line x1="270" y1="173" x2="298" y2="173" stroke="#7c8cf8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <text x="284" y="167" text-anchor="middle" fill="#7c8cf8" font-size="9">navigate()</text>

  <rect x="300" y="148" width="80" height="50" rx="5" fill="#1e2235" stroke="#f06292" stroke-width="2"/>
  <text x="340" y="168" text-anchor="middle" fill="#f06292" font-size="10">FormView</text>
  <text x="340" y="183" text-anchor="middle" fill="#3d4466" font-size="9">← current</text>

  <!-- Stack label -->
  <text x="200" y="220" text-anchor="middle" fill="#3d4466" font-size="9">_navStack  [ DetailView, FormView ]</text>

  <!-- back arrow -->
  <path d="M 340 198 Q 340 230 215 230 Q 90 230 90 198" stroke="#f06292" stroke-width="1.5" fill="none" marker-end="url(#arrow3)" stroke-dasharray="5 3"/>
  <text x="200" y="246" text-anchor="middle" fill="#f06292" font-size="10">back()  →  destroy() popped view</text>

  <!-- replace -->
  <rect x="60" y="268" width="280" height="34" rx="5" fill="#1e2235" stroke="#7c8cf8" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="200" y="282" text-anchor="middle" fill="#7c8cf8" font-size="10">replace()  →  clears stack, switches route</text>
  <text x="200" y="295" text-anchor="middle" fill="#3d4466" font-size="9">FLAG_CLEAR_TOP equivalent</text>

  <defs>
    <marker id="arrow2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c8cf8"/>
    </marker>
    <marker id="arrow3" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f06292"/>
    </marker>
  </defs>
</svg>
